<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Saree Try-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1512;
    --maroon: #7a2331;
    --maroon-deep: #591a24;
    --gold: #c9a227;
    --ivory: #fbf6ef;
    --stone: #6b5d52;
    --line: #e6dccb;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  header {
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 8px;
    color: var(--maroon-deep);
  }
  p.sub {
    margin: 0;
    color: var(--stone);
    font-size: 15px;
    line-height: 1.5;
    max-width: 42ch;
  }
  .step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .step-num {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--maroon);
    color: var(--ivory);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .drop {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    color: var(--stone);
    font-size: 13px;
    transition: border-color .15s ease;
  }
  .drop:hover, .drop:focus-visible { border-color: var(--gold); }
  .drop input { display: none; }
  .preview {
    margin-top: 10px;
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    display: none;
  }
  .preview.show { display: block; }

  .controls {
    display: flex;
    gap: 14px;
    margin: 4px 0 18px;
  }
  .field { flex: 1; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--stone);
    margin-bottom: 4px;
  }
  .field input[type=range] { width: 100%; accent-color: var(--maroon); }

  button.primary {
    width: 100%;
    background: var(--maroon);
    color: var(--ivory);
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  button.primary:hover { background: var(--maroon-deep); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }

  .status {
    margin-top: 14px;
    font-size: 14px;
    color: var(--stone);
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: var(--maroon); }

  .result {
    margin-top: 24px;
  }
  .result img {
    width: 100%;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .result-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .result-actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-download {
    background: var(--gold);
    color: var(--ink);
  }
  .btn-again {
    background: transparent;
    color: var(--maroon);
    border: 1px solid var(--maroon);
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--maroon);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>See it draped, before it ships.</h1>
      <p class="sub">Upload a customer photo and a saree photo. No description needed — the drape is worked out from the two images alone.</p>
    </header>

    <form id="tryonForm">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <div class="step-title">Customer photo</div>
          <label class="drop" id="dropCustomer" tabindex="0">
            <span id="labelCustomer">Front-facing, standing, most of the body visible</span>
            <input type="file" id="customerInput" accept="image/*" required />
          </label>
          <img id="previewCustomer" class="preview" alt="Customer photo preview" />
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">
          <div class="step-title">Saree photo</div>
          <label class="drop" id="dropSaree" tabindex="0">
            <span id="labelSaree">Laid flat, on a mannequin, or a clean product shot</span>
            <input type="file" id="sareeInput" accept="image/*" required />
          </label>
          <img id="previewSaree" class="preview" alt="Saree photo preview" />
        </div>
      </div>

      <div class="controls">
        <div class="field">
          <label for="drapeWidth">Drape width</label>
          <input type="range" id="drapeWidth" min="1.0" max="1.4" step="0.02" value="1.18" />
        </div>
        <div class="field">
          <label for="feather">Edge softness</label>
          <input type="range" id="feather" min="5" max="41" step="2" value="21" />
        </div>
      </div>

      <button type="submit" class="primary" id="submitBtn">Show the drape</button>
      <div class="status" id="status"></div>
    </form>

    <div class="result" id="resultWrap" style="display:none;">
      <img id="resultImg" alt="Try-on result" />
      <div class="result-actions">
        <a class="btn-download" id="downloadLink" download="tryon_result.png">Download</a>
        <a class="btn-again" id="tryAgainLink">Try again</a>
      </div>
    </div>
  </div>

<script>
  const API_ENDPOINT = '/api/tryon'; // same origin as this page

  function wireUpload(dropId, inputId, previewId, labelId, fileNameFallback) {
    const drop = document.getElementById(dropId);
    const input = document.getElementById(inputId);
    const preview = document.getElementById(previewId);
    const label = document.getElementById(labelId);

    drop.addEventListener('click', () => input.click());
    drop.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
    });
    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      label.textContent = file.name;
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    });
  }

  wireUpload('dropCustomer', 'customerInput', 'previewCustomer', 'labelCustomer');
  wireUpload('dropSaree', 'sareeInput', 'previewSaree', 'labelSaree');

  const form = document.getElementById('tryonForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const resultWrap = document.getElementById('resultWrap');
  const resultImg = document.getElementById('resultImg');
  const downloadLink = document.getElementById('downloadLink');
  const tryAgainLink = document.getElementById('tryAgainLink');

  tryAgainLink.addEventListener('click', (e) => {
    e.preventDefault();
    resultWrap.style.display = 'none';
    statusEl.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const customerFile = document.getElementById('customerInput').files[0];
    const sareeFile = document.getElementById('sareeInput').files[0];

    if (!customerFile || !sareeFile) {
      statusEl.textContent = 'Add both photos to continue.';
      statusEl.classList.add('error');
      return;
    }

    const fd = new FormData();
    fd.append('customer_photo', customerFile);
    fd.append('saree_photo', sareeFile);
    fd.append('drape_width_factor', document.getElementById('drapeWidth').value);
    fd.append('feather', document.getElementById('feather').value);

    submitBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.innerHTML = '<span class="spinner"></span>Draping the saree…';
    resultWrap.style.display = 'none';

    try {
      const res = await fetch(API_ENDPOINT, { method: 'POST', body: fd });
      if (!res.ok) {
        let msg = 'Something went wrong. Try a different photo.';
        try {
          const data = await res.json();
          if (data && data.error) msg = data.error;
        } catch (_) {}
        statusEl.textContent = msg;
        statusEl.classList.add('error');
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      resultImg.src = url;
      downloadLink.href = url;
      resultWrap.style.display = 'block';
      statusEl.textContent = '';
      resultWrap.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      statusEl.textContent = 'Could not reach the server. Check your connection and try again.';
      statusEl.classList.add('error');
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
